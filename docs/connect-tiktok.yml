name: Connect TikTok

on:
  workflow_dispatch:
    inputs:
      code:
        description: "Code from the callback page"
        required: true

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests pynacl
      - name: Exchange code and save refresh token
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          CODE: ${{ inputs.code }}
        run: |
          echo "::add-mask::$CODE"
          python - <<'PY'
          import os, urllib.parse, requests
          from autopost import secrets_store as S
          repo = os.environ["GITHUB_REPOSITORY"]; owner, name = repo.split("/")
          redirect = f"https://{owner.lower()}.github.io/{name}/callback.html"
          r = requests.post("https://open.tiktokapis.com/v2/oauth/token/", timeout=30,
              headers={"Content-Type": "application/x-www-form-urlencoded"},
              data={"client_key": os.environ["TIKTOK_CLIENT_KEY"], "client_secret": os.environ["TIKTOK_CLIENT_SECRET"],
                    "code": urllib.parse.unquote(os.environ["CODE"]), "grant_type": "authorization_code", "redirect_uri": redirect})
          j = r.json()
          if "refresh_token" not in j:
              raise SystemExit(f"TikTok refused the code: {j.get('error')} {j.get('error_description')}")
          print(f"::add-mask::{j['refresh_token']}"); print(f"::add-mask::{j['access_token']}")
          S.save("TIKTOK_REFRESH_TOKEN", j["refresh_token"])
          print("Connected. Scopes:", j.get("scope"))
          PY
