<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connect TikTok</title><link rel="stylesheet" href="_style.css"></head>
<body><main>
<h1>TikTok hesabını bağla</h1>
<p>TikTok geliştirici panelindeki <b>Client key</b>'i yapıştır ve düğmeye bas. Client key gizli değildir; Client secret'ı buraya yazma.</p>
<input id="k" placeholder="Client key" autocomplete="off">
<button id="go">TikTok ile giriş yap</button>
<p class="muted">Yönlendirme adresi (TikTok uygulamasına bunu ekle):</p>
<code id="r"></code>
<script>
const redirect=location.origin+location.pathname.replace(/connect\.html$/,'callback.html');
document.getElementById('r').textContent=redirect;
document.getElementById('go').onclick=()=>{const k=document.getElementById('k').value.trim();if(!k)return;
 const u=new URL('https://www.tiktok.com/v2/auth/authorize/');
 u.search=new URLSearchParams({client_key:k,scope:'user.info.basic,video.publish',response_type:'code',redirect_uri:redirect,state:Math.random().toString(36).slice(2)});
 location.href=u.toString();};
</script></main></body></html>
