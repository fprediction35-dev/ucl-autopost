name: Daily match simulations

on:
  schedule:
    - cron: "7 8 * * *"   # 08:07 UTC = 11:07 Istanbul; GitHub starts scheduled runs ~50 min late, so posting begins around 12:00 (all platforms except YouTube)
    - cron: "7 16 * * *"  # 16:07 UTC = 19:07 Istanbul, starts ~20:00: YouTube for the matches posted at noon.
                          # YouTube's ~10 uploads limit is a rolling 24h window, so YouTube gets one fixed slot a day.
  workflow_dispatch:
    inputs:
      date:
        description: "First match date of the window (YYYY-MM-DD). Empty = tomorrow"
        required: false
      dry_run:
        description: "Render only, do not post"
        type: boolean
        default: true
      only:
        description: "Platforms for this run, e.g. youtube,x (empty = all enabled)"
        required: false
      limit:
        description: "Max videos for this run (empty = config)"
        required: false
      skip:
        description: "Skip the first N matches (e.g. 4 = start from the 5th)"
        required: false
      gap:
        description: "Minutes between matches (empty = config)"
        required: false
      comps:
        description: "Competitions, e.g. UEL,UECL,TR1 (empty = all)"
        required: false
      exclude:
        description: "Leave these platforms out, e.g. youtube (matches still count as posted)"
        required: false
      backfill:
        description: "With 'only': post already-posted matches still missing a link on those platforms"
        type: boolean
        default: false

permissions:
  contents: write   # needed to attach videos to a release for Instagram

concurrency: daily-sim

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Window start
        id: check
        run: |
          D="${{ inputs.date }}"; [ -z "$D" ] && D=$(TZ=Europe/Istanbul date -d tomorrow +%F)
          echo "date=$D" >> "$GITHUB_OUTPUT"
          echo "has=true" >> "$GITHUB_OUTPUT"

      - name: Fetch open football data
        run: |
          mkdir -p ext
          for r in champions-league europe football.json; do git clone -q --depth 1 https://github.com/openfootball/$r.git ext/$r; done

      - uses: actions/setup-node@v4
        if: steps.check.outputs.has == 'true'
        with: { node-version: "20" }
      - uses: actions/setup-python@v5
        if: steps.check.outputs.has == 'true'
        with: { python-version: "3.12" }

      - name: Install
        if: steps.check.outputs.has == 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          pip install -r requirements.txt

      - name: Render and post
        if: steps.check.outputs.has == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PAT: ${{ secrets.GH_PAT }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: |
          ARGS="--date ${{ steps.check.outputs.date }}"
          [ "${{ github.event.schedule }}" = "7 8 * * *" ] && ARGS="$ARGS --exclude youtube"
          [ "${{ github.event.schedule }}" = "7 16 * * *" ] && ARGS="$ARGS --only youtube --backfill"
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          [ -n "${{ inputs.only }}" ] && ARGS="$ARGS --only ${{ inputs.only }}"
          [ -n "${{ inputs.limit }}" ] && ARGS="$ARGS --limit ${{ inputs.limit }}"
          [ -n "${{ inputs.skip }}" ] && ARGS="$ARGS --skip ${{ inputs.skip }}"
          [ -n "${{ inputs.gap }}" ] && ARGS="$ARGS --gap ${{ inputs.gap }}"
          [ -n "${{ inputs.comps }}" ] && ARGS="$ARGS --comps ${{ inputs.comps }}"
          [ "${{ inputs.backfill }}" = "true" ] && ARGS="$ARGS --backfill"
          [ -n "${{ inputs.exclude }}" ] && ARGS="$ARGS --exclude ${{ inputs.exclude }}"
          python -m autopost.main $ARGS

      - name: Remember posted matches
        if: always() && steps.check.outputs.has == 'true'
        run: |
          [ -f data/posted.json ] || exit 0
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posted.json
          git diff --cached --quiet && exit 0
          git commit -qm "Posted matches ${{ steps.check.outputs.date }}${{ github.event.schedule == '7 16 * * *' && ' (youtube)' || '' }}"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done

      - name: Keep videos for 7 days
        if: always() && steps.check.outputs.has == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ steps.check.outputs.date }}
          path: out/
          retention-days: 7
